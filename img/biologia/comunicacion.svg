<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1d2a3a"/></marker>
  </defs>
  <rect width="360" height="362" rx="14" fill="#fffdf6"/>
  <text x="180" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2a3a">5 formas de comunicación celular</text>

  <!-- 1 Endocrina -->
  <g transform="translate(0 40)">
    <rect x="10" y="2" width="340" height="58" rx="10" fill="#fdeef0"/>
    <circle cx="30" cy="31" r="12" fill="#f8c9d1" stroke="#c0394f" stroke-width="1.5"/>
    <rect x="50" y="10" width="30" height="42" rx="6" fill="#e05a6b" opacity=".85"/>
    <g fill="#fff"><circle cx="58" cy="22" r="3"/><circle cx="68" cy="34" r="3"/><circle cx="60" cy="44" r="3"/></g>
    <circle cx="106" cy="31" r="12" fill="#cfe6f7" stroke="#2e6e9e" stroke-width="1.5"/>
    <text x="130" y="22" font-size="13" font-weight="800" fill="#c0394f">Endocrina</text>
    <text x="130" y="38" font-size="11.5" fill="#1d2a3a">Hormonas viajan por la sangre</text>
    <text x="130" y="52" font-size="11" fill="#555">Ej.: crecimiento, pubertad</text>
  </g>

  <!-- 2 Paracrina -->
  <g transform="translate(0 104)">
    <rect x="10" y="2" width="340" height="58" rx="10" fill="#fff4e0"/>
    <circle cx="40" cy="31" r="14" fill="#f8c9d1" stroke="#c0394f" stroke-width="1.5"/>
    <g fill="#e89a2c"><circle cx="60" cy="26" r="3"/><circle cx="66" cy="36" r="3"/><circle cx="72" cy="28" r="3"/></g>
    <circle cx="94" cy="31" r="14" fill="#cfe6f7" stroke="#2e6e9e" stroke-width="1.5"/>
    <text x="130" y="22" font-size="13" font-weight="800" fill="#b8730f">Paracrina</text>
    <text x="130" y="38" font-size="11.5" fill="#1d2a3a">Señales a las células vecinas</text>
    <text x="130" y="52" font-size="11" fill="#555">Ej.: apetito o saciedad</text>
  </g>

  <!-- 3 Autocrina -->
  <g transform="translate(0 168)">
    <rect x="10" y="2" width="340" height="58" rx="10" fill="#eef6e6"/>
    <circle cx="60" cy="36" r="16" fill="#f8c9d1" stroke="#c0394f" stroke-width="1.5"/>
    <path d="M74 28 C96 10 96 50 78 44" fill="none" stroke="#2f7d32" stroke-width="2" marker-end="url(#ar)"/>
    <g fill="#2f7d32"><circle cx="88" cy="20" r="2.5"/><circle cx="92" cy="34" r="2.5"/></g>
    <text x="130" y="22" font-size="13" font-weight="800" fill="#2f7d32">Autocrina</text>
    <text x="130" y="38" font-size="11.5" fill="#1d2a3a">La célula se manda señales a sí misma</text>
    <text x="130" y="52" font-size="11" fill="#555">Ej.: linfocitos T se multiplican</text>
  </g>

  <!-- 4 Sináptica -->
  <g transform="translate(0 232)">
    <rect x="10" y="2" width="340" height="58" rx="10" fill="#eef1fb"/>
    <circle cx="26" cy="31" r="10" fill="#d9b8ea" stroke="#7a4b99" stroke-width="1.5"/>
    <g stroke="#7a4b99" stroke-width="1.5"><line x1="20" y1="23" x2="14" y2="14"/><line x1="20" y1="39" x2="14" y2="48"/></g>
    <line x1="36" y1="31" x2="66" y2="31" stroke="#7a4b99" stroke-width="3"/>
    <path d="M66 22 a9 9 0 0 1 0 18 z" fill="#d9b8ea" stroke="#7a4b99" stroke-width="1.5"/>
    <g fill="#2e6e9e"><circle cx="80" cy="26" r="2.2"/><circle cx="82" cy="35" r="2.2"/><circle cx="87" cy="30" r="2.2"/></g>
    <path d="M110 18 a13 13 0 0 0 0 26" fill="#d9b8ea" stroke="#7a4b99" stroke-width="1.5"/>
    <rect x="96" y="20" width="4" height="22" fill="#d9b8ea"/>
    <text x="130" y="22" font-size="13" font-weight="800" fill="#4a5fbf">Sináptica</text>
    <text x="130" y="38" font-size="11.5" fill="#1d2a3a">Entre neuronas (neurotransmisores)</text>
    <text x="130" y="52" font-size="11" fill="#555">Ej.: memoria y aprendizaje</text>
  </g>

  <!-- 5 Por contacto -->
  <g transform="translate(0 296)">
    <rect x="10" y="2" width="340" height="58" rx="10" fill="#f3ecf8"/>
    <circle cx="48" cy="31" r="17" fill="#f8c9d1" stroke="#c0394f" stroke-width="1.5"/>
    <circle cx="80" cy="31" r="17" fill="#cfe6f7" stroke="#2e6e9e" stroke-width="1.5"/>
    <g stroke="#1d2a3a" stroke-width="1.6"><line x1="62" y1="24" x2="66" y2="24"/><line x1="62" y1="31" x2="66" y2="31"/><line x1="62" y1="38" x2="66" y2="38"/></g>
    <text x="130" y="22" font-size="13" font-weight="800" fill="#7a4b99">Por contacto (yuxtacrina)</text>
    <text x="130" y="38" font-size="11.5" fill="#1d2a3a">Se tocan directamente las células</text>
    <text x="130" y="52" font-size="11" fill="#555">Ej.: formar tejidos como músculo</text>
  </g>
</svg>
