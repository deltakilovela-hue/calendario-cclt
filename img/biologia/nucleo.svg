<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 285" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="360" height="285" rx="14" fill="#fffdf6"/>
  <text x="180" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2a3a">Partes del núcleo</text>

  <circle cx="125" cy="155" r="98" fill="#e7d6f2" stroke="#7a4b99" stroke-width="3"/>
  <circle cx="125" cy="155" r="90" fill="#f3eaf9" stroke="#7a4b99" stroke-width="2.5"/>
  <!-- poros -->
  <g fill="#fffdf6" stroke="#7a4b99" stroke-width="1.5">
    <circle cx="213" cy="123" r="4.5"/><circle cx="206" cy="203" r="4.5"/><circle cx="157" cy="66" r="4.5"/>
    <circle cx="65" cy="83" r="4.5"/><circle cx="38" cy="186" r="4.5"/><circle cx="109" cy="248" r="4.5"/>
  </g>
  <!-- material genético -->
  <g fill="none" stroke="#d0477a" stroke-width="2.2" stroke-linecap="round">
    <path d="M70 120 q8 -10 16 0 t16 0 t16 0"/>
    <path d="M60 150 q8 10 16 0 t16 0"/>
    <path d="M80 205 q8 -10 16 0 t16 0 t16 0"/>
    <path d="M105 95 q8 10 16 0 t16 0"/>
  </g>
  <circle cx="150" cy="160" r="22" fill="#7a4b99"/>

  <g stroke="#1d2a3a" stroke-width="1" fill="none">
    <line x1="236" y1="62" x2="196" y2="88"/>
    <line x1="236" y1="120" x2="219" y2="122"/>
    <line x1="236" y1="160" x2="173" y2="160"/>
    <line x1="236" y1="205" x2="185" y2="192"/>
    <line x1="236" y1="250" x2="128" y2="210"/>
  </g>
  <g font-size="12.5" fill="#1d2a3a">
    <text x="240" y="60" font-weight="700">Envoltura nuclear</text>
    <text x="240" y="75" font-size="11">2 membranas, porosa</text>
    <text x="240" y="118" font-weight="700">Poros nucleares</text>
    <text x="240" y="133" font-size="11">canales de entrada</text>
    <text x="240" y="146" font-size="11">y salida</text>
    <text x="240" y="164" font-weight="700">Nucléolo</text>
    <text x="240" y="178" font-size="11">organelo de adentro</text>
    <text x="240" y="203" font-weight="700">Nucleoplasma</text>
    <text x="240" y="218" font-size="11">el citosol del núcleo</text>
    <text x="240" y="248" font-weight="700">Material genético</text>
    <text x="240" y="263" font-size="11">lo que guarda el núcleo</text>
  </g>
</svg>
