<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1d2a3a"/></marker>
  </defs>
  <rect width="360" height="290" rx="14" fill="#fffdf6"/>
  <text x="180" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2a3a">Teoría endosimbiótica</text>

  <!-- Paso 1 -->
  <circle cx="54" cy="92" r="34" fill="#e8e0f4" stroke="#7a4b99" stroke-width="2"/>
  <ellipse cx="54" cy="148" rx="13" ry="7" fill="#f6a56b" stroke="#c0622a" stroke-width="1.5"/>
  <ellipse cx="28" cy="146" rx="9" ry="5" fill="#7cc576" stroke="#2f7d32" stroke-width="1.5"/>
  <text x="54" y="178" text-anchor="middle" font-size="11" fill="#1d2a3a">Célula grande y</text>
  <text x="54" y="191" text-anchor="middle" font-size="11" fill="#1d2a3a">bacterias pequeñas</text>
  <text x="54" y="50" text-anchor="middle" font-size="13" font-weight="800" fill="#7a4b99">1</text>

  <line x1="96" y1="100" x2="122" y2="100" stroke="#1d2a3a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Paso 2 -->
  <circle cx="178" cy="100" r="44" fill="#e8e0f4" stroke="#7a4b99" stroke-width="2"/>
  <ellipse cx="168" cy="88" rx="16" ry="9" fill="#f6a56b" stroke="#c0622a" stroke-width="1.5"/>
  <ellipse cx="168" cy="88" rx="20" ry="13" fill="none" stroke="#7a4b99" stroke-width="1.2" stroke-dasharray="3 2"/>
  <ellipse cx="192" cy="118" rx="12" ry="7" fill="#7cc576" stroke="#2f7d32" stroke-width="1.5"/>
  <text x="178" y="166" text-anchor="middle" font-size="11" fill="#1d2a3a">Se las “come” pero</text>
  <text x="178" y="179" text-anchor="middle" font-size="11" fill="#1d2a3a">no las digiere:</text>
  <text x="178" y="192" text-anchor="middle" font-size="11" fill="#1d2a3a">conviven adentro</text>
  <text x="178" y="50" text-anchor="middle" font-size="13" font-weight="800" fill="#7a4b99">2</text>

  <line x1="228" y1="100" x2="254" y2="100" stroke="#1d2a3a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Paso 3 -->
  <circle cx="304" cy="100" r="44" fill="#e8e0f4" stroke="#7a4b99" stroke-width="2"/>
  <circle cx="300" cy="96" r="13" fill="#d9b8ea" stroke="#7a4b99" stroke-width="1.5"/>
  <ellipse cx="282" cy="124" rx="13" ry="7" fill="#f6a56b" stroke="#c0622a" stroke-width="1.5"/>
  <path d="M272 124 l3 -3 l3 5 l3 -5 l3 5 l3 -5 l3 3" fill="none" stroke="#c0622a" stroke-width="1"/>
  <ellipse cx="324" cy="122" rx="12" ry="7" fill="#7cc576" stroke="#2f7d32" stroke-width="1.5"/>
  <text x="304" y="166" text-anchor="middle" font-size="11" fill="#1d2a3a">Célula eucariota con</text>
  <text x="304" y="179" text-anchor="middle" font-size="11" fill="#c0622a" font-weight="700">mitocondria</text>
  <text x="304" y="192" text-anchor="middle" font-size="11" fill="#2f7d32" font-weight="700">y cloroplasto</text>
  <text x="304" y="50" text-anchor="middle" font-size="13" font-weight="800" fill="#7a4b99">3</text>

  <!-- Evidencias -->
  <rect x="12" y="206" width="336" height="74" rx="10" fill="#f1ede3"/>
  <text x="24" y="225" font-size="12.5" font-weight="800" fill="#1d2a3a">3 evidencias (mitocondrias y cloroplastos):</text>
  <text x="24" y="243" font-size="11.5" fill="#1d2a3a">1. Tienen su propio ADN</text>
  <text x="24" y="258" font-size="11.5" fill="#1d2a3a">2. Miden casi lo mismo que algunas bacterias</text>
  <text x="24" y="273" font-size="11.5" fill="#1d2a3a">3. Tienen doble membrana</text>
</svg>
