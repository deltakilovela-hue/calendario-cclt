<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="360" height="215" rx="14" fill="#fffdf6"/>
  <text x="180" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2a3a">Las 4 fases de la mitosis</text>

  <g stroke-linecap="round">
  <!-- 1 Profase -->
  <ellipse cx="47" cy="85" rx="38" ry="34" fill="#fde6d2" stroke="#e0a030" stroke-width="2"/>
  <circle cx="47" cy="85" r="23" fill="none" stroke="#7a4b99" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g stroke-width="3.5">
    <g stroke="#d0477a"><line x1="34" y1="70" x2="44" y2="82"/><line x1="44" y1="70" x2="34" y2="82"/></g>
    <g stroke="#2e6e9e"><line x1="50" y1="86" x2="60" y2="98"/><line x1="60" y1="86" x2="50" y2="98"/></g>
    <g stroke="#d0477a"><line x1="52" y1="68" x2="59" y2="76"/><line x1="59" y1="68" x2="52" y2="76"/></g>
    <g stroke="#2e6e9e"><line x1="33" y1="90" x2="40" y2="98"/><line x1="40" y1="90" x2="33" y2="98"/></g>
  </g>

  <!-- 2 Metafase -->
  <ellipse cx="135" cy="85" rx="38" ry="34" fill="#fde6d2" stroke="#e0a030" stroke-width="2"/>
  <g stroke="#9aa3ad" stroke-width="1">
    <line x1="103" y1="85" x2="135" y2="63"/><line x1="103" y1="85" x2="135" y2="77"/><line x1="103" y1="85" x2="135" y2="93"/><line x1="103" y1="85" x2="135" y2="107"/>
    <line x1="167" y1="85" x2="135" y2="63"/><line x1="167" y1="85" x2="135" y2="77"/><line x1="167" y1="85" x2="135" y2="93"/><line x1="167" y1="85" x2="135" y2="107"/>
  </g>
  <circle cx="103" cy="85" r="2.5" fill="#1d2a3a"/><circle cx="167" cy="85" r="2.5" fill="#1d2a3a"/>
  <g stroke-width="3.5">
    <g stroke="#d0477a"><line x1="130" y1="58" x2="140" y2="68"/><line x1="140" y1="58" x2="130" y2="68"/></g>
    <g stroke="#2e6e9e"><line x1="130" y1="72" x2="140" y2="82"/><line x1="140" y1="72" x2="130" y2="82"/></g>
    <g stroke="#d0477a"><line x1="130" y1="88" x2="140" y2="98"/><line x1="140" y1="88" x2="130" y2="98"/></g>
    <g stroke="#2e6e9e"><line x1="130" y1="102" x2="140" y2="112"/><line x1="140" y1="102" x2="130" y2="112"/></g>
  </g>
  <line x1="135" y1="52" x2="135" y2="118" stroke="#1d2a3a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- 3 Anafase -->
  <ellipse cx="223" cy="85" rx="40" ry="32" fill="#fde6d2" stroke="#e0a030" stroke-width="2"/>
  <g stroke="#9aa3ad" stroke-width="1">
    <line x1="189" y1="85" x2="207" y2="64"/><line x1="189" y1="85" x2="207" y2="106"/>
    <line x1="257" y1="85" x2="239" y2="64"/><line x1="257" y1="85" x2="239" y2="106"/>
  </g>
  <circle cx="189" cy="85" r="2.5" fill="#1d2a3a"/><circle cx="257" cy="85" r="2.5" fill="#1d2a3a"/>
  <g stroke-width="3.5">
    <line x1="203" y1="62" x2="210" y2="70" stroke="#d0477a"/><line x1="203" y1="76" x2="210" y2="84" stroke="#2e6e9e"/><line x1="203" y1="88" x2="210" y2="96" stroke="#d0477a"/><line x1="203" y1="100" x2="210" y2="108" stroke="#2e6e9e"/>
    <line x1="243" y1="62" x2="236" y2="70" stroke="#d0477a"/><line x1="243" y1="76" x2="236" y2="84" stroke="#2e6e9e"/><line x1="243" y1="88" x2="236" y2="96" stroke="#d0477a"/><line x1="243" y1="100" x2="236" y2="108" stroke="#2e6e9e"/>
  </g>

  <!-- 4 Telofase -->
  <path d="M311 60 C292 52 270 64 272 85 C270 106 292 118 311 110 C330 118 352 106 350 85 C352 64 330 52 311 60 Z" fill="#fde6d2" stroke="#e0a030" stroke-width="2"/>
  <circle cx="291" cy="85" r="13" fill="#e8d6f3" stroke="#7a4b99" stroke-width="1.5"/>
  <circle cx="331" cy="85" r="13" fill="#e8d6f3" stroke="#7a4b99" stroke-width="1.5"/>
  <g stroke-width="2.5">
    <line x1="286" y1="79" x2="290" y2="84" stroke="#d0477a"/><line x1="293" y1="83" x2="297" y2="88" stroke="#2e6e9e"/><line x1="285" y1="88" x2="289" y2="93" stroke="#2e6e9e"/><line x1="293" y1="76" x2="297" y2="81" stroke="#d0477a"/>
    <line x1="326" y1="79" x2="330" y2="84" stroke="#d0477a"/><line x1="333" y1="83" x2="337" y2="88" stroke="#2e6e9e"/><line x1="325" y1="88" x2="329" y2="93" stroke="#2e6e9e"/><line x1="333" y1="76" x2="337" y2="81" stroke="#d0477a"/>
  </g>
  </g>

  <g text-anchor="middle" fill="#1d2a3a">
    <text x="47" y="140" font-size="12.5" font-weight="800">1. Profase</text>
    <text x="47" y="155" font-size="10.5">aparecen los</text><text x="47" y="168" font-size="10.5">cromosomas</text>
    <text x="135" y="140" font-size="12.5" font-weight="800">2. Metafase</text>
    <text x="135" y="155" font-size="10.5">se alinean</text><text x="135" y="168" font-size="10.5">en el centro</text>
    <text x="223" y="140" font-size="12.5" font-weight="800">3. Anafase</text>
    <text x="223" y="155" font-size="10.5">se separan a</text><text x="223" y="168" font-size="10.5">los extremos</text>
    <text x="311" y="140" font-size="12.5" font-weight="800">4. Telofase</text>
    <text x="311" y="155" font-size="10.5">se forman</text><text x="311" y="168" font-size="10.5">2 núcleos</text>
  </g>
  <rect x="40" y="181" width="280" height="24" rx="12" fill="#eef6e6"/>
  <text x="180" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#2f7d32">Resultado: 2 células idénticas a la original</text>
</svg>
